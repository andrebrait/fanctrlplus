name: Release Unraid Plugin

on:
  release:
    types: [released]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The action's own changelog (PLUGIN_CHANGELOG) includes pre-releases;
      # plugin.j2 uses this stable-only one instead. Steps inside the action
      # inherit variables written to GITHUB_ENV.
      - name: Collect stable release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'STABLE_CHANGELOG<<CHANGELOG_EOF'
            gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 3 --json tagName --jq '.[].tagName' |
              while read -r tag; do
                gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json name,body --jq '"### \(.name)\n\n\(.body)\n"' | tr -d '\r'
              done
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_ENV"
      # Includes checkout v7, setup-go v6, and add-and-commit v10.
      - uses: dkaser/unraid-plugin-release-action@dd44159f2d27c70b101db9cf76d6f11babc3e6f0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_version: ${{ github.event.release.name }}
          plg_branch: main
          # The plugin manager renders the packaged README.md as this plugin's
          # description on the Plugins page, so it gets the short description
          # rather than the project's README.
          build_script: |
            cp LICENSE NOTICE THIRD_PARTY_NOTICES.md src/usr/local/emhttp/plugins/fanctrlplus2/
            cp plugin/description.md src/usr/local/emhttp/plugins/fanctrlplus2/README.md
